baseURL = "https://birgitbader.com/"
locale = "en-us"
defaultContentLanguage = "en"
title = "Birgit Bader"

enableRobotsTXT = true

# Leere Taxonomie-Seiten nicht bauen (keine Tags/Categories im Einsatz)
disableKinds = ["taxonomy", "term"]

# Teaser-Laenge fuer .Summary (Woerter)
summaryLength = 40

[params]
  description = "Birgit Bader is a technical communication expert and information architect in Hamburg, Germany, writing about information development, documentation, and helping knowledge move."
  author = "Birgit Bader"
  ogImage = "/images/og-image.png"
  email = "diplomatintech@web.de"
  linkedin = "https://www.linkedin.com/in/birgit-b-838503207"
  jobTitle = "Technical Writer & Information Architect"
  locality = "Hamburg"
  country = "Germany"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false

[services]
  [services.rss]
    limit = 20
