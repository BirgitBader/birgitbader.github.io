baseURL = "https://birgitbader.com/"
locale = "en-us"
defaultContentLanguage = "en"
title = "Birgit Bader"

enableRobotsTXT = true

# CLAUDE.md-Dateien in content/ sind interne Konventionen, nicht fuer den Build
ignoreFiles = ['CLAUDE\.md$']

# Die Tag-Uebersichtsseite (/tags/) wird nicht gebaut — die Kategorien
# werden direkt auf /blog/ gelistet. Die einzelnen Tag-Seiten (/tags/xyz/)
# bleiben ueber "term" aktiv.
disableKinds = ["taxonomy"]

# Nur "tags" als Taxonomie — "categories" ist ungenutzt und soll nicht
# automatisch mitgebaut werden.
[taxonomies]
  tag = "tags"

# Teaser-Laenge fuer .Summary (Woerter)
summaryLength = 40

[params]
  # Fallback-Description fuer Startseite, 404 und Seiten ohne eigene.
  # Max. ~160 Zeichen, sonst schneidet Google ab. Der Name steht im Titel
  # direkt darueber, muss hier also nicht wiederholt werden.
  description = "Technical communication expert and information architect in Hamburg. Helps knowledge move where different disciplines, priorities, and perspectives meet."
  architect = "Birgit Bader"
  ogImage = "/images/og-image.png"
  email = "diplomatintech@web.de"
  linkedin = "https://www.linkedin.com/in/birgit-b-838503207"
  jobTitle = "Technical Communication & Enablement"
  locality = "Hamburg"
  country = "Germany"

  # GoatCounter-Site-Code (das "MYCODE" aus https://MYCODE.goatcounter.com).
  # Nach Registrierung auf goatcounter.com hier eintragen.
  goatcounterCode = "diplomatintech"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false

[services]
  [services.rss]
    limit = 20
