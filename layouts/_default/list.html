{{ define "main" }}

<h1>{{ .Title }}</h1>

{{ .Content }}

{{ range .Pages }}

<article class="post-preview">

    <h2>
        <a href="{{ .RelPermalink }}">
            {{ .Title }}
        </a>
    </h2>

    <div class="meta">

        {{ .ReadingTime }} min read ·
        {{ .Date.Format "2 January 2006" }}

    </div>

    <p>{{ .Summary }}</p>

    <a class="continue" href="{{ .RelPermalink }}">
        Continue reading →
    </a>

</article>

{{ end }}

{{ end }}
