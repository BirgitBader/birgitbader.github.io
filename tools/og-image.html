<!doctype html>
<!--
  Vorlage fuer das Vorschaubild beim Teilen (LinkedIn, Slack, X …), 1200 x 627 —
  das von LinkedIn empfohlene Format.
  Nach einer Textaenderung neu erzeugen (aus dem Repo-Root):

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --window-size=1200,627 --force-device-scale-factor=1 \
      --screenshot="$PWD/assets/images/og-image.png" "file://$PWD/tools/og-image.html"

  Die Bild-URL bekommt beim Build einen Fingerprint — ein neues Bild hat damit
  automatisch eine neue Adresse, und LinkedIn & Co. zeigen nicht das alte aus dem Cache.
  Alt-Text passend halten: og:image:alt in layouts/partials/head.html.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    width: 1200px;
    height: 627px;
    overflow: hidden;
  }

  body {
    position: relative;
    background: #E6D8C9;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #2b2b2b;
    -webkit-font-smoothing: antialiased;
  }

  .bar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 24px;
    background: #5F7360;
  }

  .circle {
    position: absolute;
    border-radius: 50%;
    background: #D7CBBA;
  }

  .circle-top {
    width: 520px;
    height: 520px;
    left: 740px;
    top: -110px;
  }

  .circle-bottom {
    width: 420px;
    height: 420px;
    left: 690px;
    top: 470px;
  }

  .content {
    position: absolute;
    left: 96px;
    top: 180px;
  }

  h1 {
    margin: 0;
    font-size: 84px;
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1;
  }

  .rule {
    width: 104px;
    height: 6px;
    margin: 34px 0 40px;
    border-radius: 3px;
    background: #5F7360;
  }

  .tagline {
    margin: 0;
    font-size: 34px;
    line-height: 1.6;
    color: #3a3a3a;
  }

  .url {
    position: absolute;
    left: 96px;
    bottom: 52px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: #5F7360;
  }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="circle circle-top"></div>
  <div class="circle circle-bottom"></div>

  <div class="content">
    <h1>Birgit Bader</h1>
    <div class="rule"></div>
    <p class="tagline">Diplomat in Tech. Technical Communication.<br>Knowledge Management.</p>
  </div>

  <div class="url">birgitbader.com</div>
</body>
</html>
